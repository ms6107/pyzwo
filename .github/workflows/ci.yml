name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Ruff & Mypy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Run ruff and mypy checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy pyzwohid tests

  unit-tests:
    name: Unit Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
