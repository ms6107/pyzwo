[project]
name = "pyzwo"
version = "0.1.0"
description = "Pure-Python USB HID interface to ZWO astronomy hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "pyzwo/LICENSE.zwo"]
authors = [{ name = "Maksim Semenov", email = "ms6107@gmail.com" }]
dependencies = [
    "hid>=1.0.8",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyzwo"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]
